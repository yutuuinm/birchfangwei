<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>白桦官方定制防伪验证</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
    --green-main: #3e7259;
    --green-light: #81b89c;
    --green-bg: #e6f1ec;
    --green-card: rgba(255,255,255,0.88);
    --text-dark: #274637;
    --text-light: #547c68;
    --border-green: #a8ccbb;
    --success-green: #48a878;
    --warn-orange: #d49b40;
    --danger-red: #c25c5c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background-color: var(--green-bg);
    color: var(--text-dark);
    min-height: 100vh;
}
/* 头部 */
.brand-header{
    width: 100%;
    background: linear-gradient(145deg, var(--green-main), var(--green-light));
    padding: 36px 20px 64px;
    text-align: center;
    color:#fff;
    position: relative;
}
.brand-logo{
    width:72px;height:72px;margin:0 auto 14px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;
}
.brand-logo svg{width:46px;height:46px;fill:var(--green-main);}
.brand-header h1{font-size:22px;font-weight:700;}
.brand-header p{font-size:13px;opacity:0.9;margin-top:6px;}
/* 居中主容器 */
.main-wrap{
    max-width:420px;margin:-36px auto 0;padding:0 16px;position:relative;z-index:10;padding-bottom:40px;
}
.card{
    background:var(--green-card);border-radius:22px;padding:26px 22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(62,114,89,0.12);
}
/* 验证选择 */
.verify-box{display:flex;flex-direction:column;gap:12px;}
.method{
    background:#fff;border-radius:18px;padding:22px;cursor:pointer;border:1px solid transparent;transition:0.24s;
}
.method:hover{border-color:var(--border-green);transform:translateY(-2px);}
.method:active{transform:scale(0.985);}
.method .icon{width:48px;height:48px;border-radius:14px;background:#d7efe3;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px;}
.method h3{font-size:17px;margin-bottom:4px;}
.method p{font-size:13px;color:var(--text-light);line-height:1.5;}
.method.admin{display:none;}
/* 输入面板 */
.input-area{display:none;}
.input-area.show{display:block;animation:fadeIn 0.4s;}
.back-btn{
    display:inline-flex;align-items:center;gap:6px;background:#e0ede7;border:none;padding:8px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;cursor:pointer;color:var(--text-dark);
}
.input-row{position:relative;margin-bottom:14px;}
.input-row input{
    width:100%;padding:15px 16px 15px 46px;border:2px solid var(--border-green);border-radius:14px;background:#f6fbf8;font-size:15px;color:var(--text-dark);
}
.input-row input:focus{outline:none;border-color:var(--green-main);background:#fff;}
.input-row .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;}
.btn{
    width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--green-main),var(--green-light));box-shadow:0 4px 14px rgba(62,114,89,0.22);cursor:pointer;
}
.btn:active{transform:translateY(2px);}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.btn-light{background:#fff;color:var(--green-main);border:2px solid var(--green-main);}
/* 验证结果 */
.result-card{display:none;text-align:center;}
.result-card.show{display:block;animation:fadeIn 0.5s;}
.circle{width:90px;height:90px;border-radius:50px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px;}
.circle-success{background:#e8f5ef;color:var(--success-green);}
.circle-warn{background:#fff6e3;color:var(--warn-orange);}
.circle-fake{background:#fee;color:var(--danger-red);}
.result-title{font-size:22px;font-weight:600;margin-bottom:8px;}
.title-success{color:var(--success-green);}
.title-warn{color:var(--warn-orange);}
.title-fake{color:var(--danger-red);}
.result-desc{font-size:14px;color:var(--text-light);line-height:1.6;margin-bottom:20px;}
.info-list{background:#f6fbf8;border-radius:14px;padding:18px;text-align:left;margin-bottom:20px;}
.info-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-green);font-size:14px;}
.info-line:last-child{border:none;}
.info-label{color:var(--text-light);}
.info-val{font-weight:500;word-break:break-all;}
.msg-box{background:#fff6e3;border-radius:14px;padding:18px;text-align:left;margin-bottom:20px;display:none;}
.msg-box.show{display:block;}
.back-bottom{
    width:100%;padding:14px;border:2px solid var(--green-main);background:transparent;color:var(--green-main);border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;
}
/* 管理员生成面板 */
.gen-panel{display:none;}
.gen-panel.show{display:block;}
.form-item{margin-bottom:16px;}
.form-item label{font-size:13px;font-weight:500;color:var(--text-light);display:block;margin-bottom:6px;}
.form-item input,.form-item textarea{
    width:100%;padding:13px 16px;border:2px solid var(--border-green);border-radius:12px;background:#f6fbf8;font-size:15px;
}
.qr-view{text-align:center;padding:20px;background:#f6fbf8;border-radius:16px;margin-top:18px;display:none;}
.qr-view.show{display:block;}
/* 弹窗通用 */
.modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px;
}
.modal-mask.show{display:flex;}
.modal-box{width:100%;max-width:350px;background:#fff;border-radius:22px;padding:30px 24px;text-align:center;}
.db-modal .modal-box{max-width:500;}
textarea#dbEditor{width:100%;min-height:240px;padding:12px;border:1px solid var(--border-green);border-radius:10px;margin:12px 0;}
/* 扫码弹窗 */
.scan-mask{
    position:fixed;inset:0;background:rgba(0,0,0.92);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px;
}
.scan-mask.show{display:flex;}
.scan-wrap{width:100%;max-width:420px;background:#1f332a;border-radius:22px;padding:16px;}
#reader{width:100%;border-radius:16px;overflow:hidden;}
.scan-ctrl{display:flex;gap:8px;margin-top:12px;}
.scan-ctrl button{flex:1;padding:10px;border:none;border-radius:10px;color:#fff;font-size:13px;}
.btn-scan-close{background:#40584c;}
.btn-scan-img{background:var(--success-green);}
.btn-scan-switch{background:var(--green-main);}
/* 动画 */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
/* Toast提示 */
.toast{
    position:fixed;left:50%;top:30px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;z-index:9999;opacity:0;pointer-events:none;transition:0.3s;
}
.toast.show{opacity:1;top:40px;}
/* 底部文字 */
.footer{text-align:center;padding:24px;font-size:12px;color:var(--text-light);}
/* 数据库记录列表 */
.db-list-wrap{background:#f6fbf8;border-radius:16px;padding:16px;margin-top:18px;max-height:400px;overflow-y:auto;}
.db-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.db-list-header h4{font-size:15px;color:var(--text-dark);}
.db-list-header span{font-size:12px;color:var(--text-light);}
.db-record{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border-green);}
.db-record-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.db-record-id{font-family:monospace;font-size:12px;color:var(--green-main);font-weight:600;}
.db-record-body{font-size:13px;color:var(--text-light);line-height:1.5;}
.db-record-body span{display:inline-block;margin-right:10px;}
.db-record-actions{display:flex;gap:8px;margin-top:8px;}
.db-record-actions button{flex:1;padding:8px;border:none;border-radius:8px;font-size:12px;cursor:pointer;}
.btn-del{background:#fee;color:var(--danger-red);border:1px solid var(--danger-red);}
.btn-view{background:#e0ede7;color:var(--text-dark);}
.empty-tip{text-align:center;color:var(--text-light);font-size:13px;padding:20px;}
</style>
</head>

<script>
const DB_KEY = "antiFakeDB_v2";
const ADMIN_PASSWORD = "030227";
let db = { records: [], settings: { password: ADMIN_PASSWORD } };
let scanner = null;
let currentCamera = "environment";
let currentQrData = null;
// 唤醒计数
let keyPressCount = 0, keyTimer;
let tapClickCount = 0, tapTimer;

// 本地数据库读写
function loadData(){
    const cache = localStorage.getItem(DB_KEY);
    if(cache){
        try{ db = JSON.parse(cache); }catch(e){ db = { records:[],settings:{password:ADMIN_PASSWORD} }; }
    }
    if(!db.records) db.records = [];
    if(!db.settings) db.settings = {password:ADMIN_PASSWORD};
}
function saveData(){
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    renderDbList();
}

// 轻提示
function toast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),2500);
}

// 返回首页
function backHome(){
    document.getElementById("homePanel").style.display="flex";
    document.querySelectorAll(".input-area,.result-card,.gen-panel").forEach(el=>el.classList.remove("show"));
    document.getElementById("inputId").value = "";
}

// 密码弹窗控制
function openPwdModal(){
    document.getElementById("pwdModal").classList.add("show");
    document.getElementById("pwdInput").value = "";
    document.getElementById("pwdErr").innerText = "";
    setTimeout(()=>document.getElementById("pwdInput").focus(), 100);
}
function closePwdModal(){
    document.getElementById("pwdModal").classList.remove("show");
}
function checkPwd(){
    const val = document.getElementById("pwdInput").value.trim();
    if(val === ADMIN_PASSWORD){
        closePwdModal();
        document.getElementById("homePanel").style.display="none";
        document.getElementById("genPanel").classList.add("show");
        renderDbList();
    }else{
        document.getElementById("pwdErr").innerText = "密码错误，请重试";
    }
}

// 唤醒监听：键盘连续6个8
document.addEventListener("keydown",e=>{
    if(e.key === "8"){
        keyPressCount++;
        clearTimeout(keyTimer);
        keyTimer = setTimeout(()=>keyPressCount=0,1200);
        if(keyPressCount >=6){
            keyPressCount = 0;
            document.getElementById("adminEntry").style.display="block";
            openPwdModal();
        }
    }else{
        keyPressCount = 0;
    }
})
// 头部6次点击唤醒
document.getElementById("tapArea").addEventListener("click",()=>{
    tapClickCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>tapClickCount=0,1500);
    if(tapClickCount >=6){
        tapClickCount = 0;
        document.getElementById("adminEntry").style.display="block";
        openPwdModal();
    }
})

// 切换手动输入面板
function showInputPanel(){
    document.getElementById("homePanel").style.display="none";
    document.getElementById("inputPanel").classList.add("show");
    setTimeout(()=>document.getElementById("inputId").focus(), 100);
}

// 生成唯一防伪ID
function generateId(){
    const time = Date.now().toString(36).toUpperCase();
    const r1 = Math.random().toString(36).slice(2,8).toUpperCase();
    const r2 = Math.random().toString(36).slice(2,6).toUpperCase();
    return `${time}-${r1}`;
}
function getVerifyUrl(id){
    return `https://www.birchfangwei.cc.cd?verify=${id}`;
}

// 单个生成防伪码
function createSingleCode(){
    const name = document.getElementById("genName").value.trim();
    const batch = document.getElementById("genBatch").value.trim();
    const remark = document.getElementById("genRemark").value.trim();
    const msg = document.getElementById("genMsg").value.trim();
    if(!name) return toast("请填写产品名称");
    const record = {
        id: generateId(),
        productName: name,
        batchNo: batch,
        remark: remark,
        message: msg,
        createTime: new Date().toLocaleString(),
        createTimestamp: Date.now(),
        verifyCount: 0,
        verifyHistory: []
    };
    db.records.push(record);
    saveData();
    currentQrData = record;
    // 渲染二维码
    const wrap = document.getElementById("qrShow");
    wrap.classList.add("show");
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"),{
        text: getVerifyUrl(record.id),
        width: 180, height: 180,
        colorDark: "#274637", colorLight: "#ffffff"
    })
    // 同步到导出卡片
    document.getElementById("exportIdText").innerText = record.id;
    document.getElementById("exportProductName").innerText = record.productName;
    document.getElementById("exportBatchNo").innerText = record.batchNo ? '批次：' + record.batchNo : '';
    document.getElementById("exportQrArea").innerHTML = "";
    new QRCode(document.getElementById("exportQrArea"),{
        text: getVerifyUrl(record.id),
        width: 180, height: 180,
        colorDark: "#274637", colorLight: "#ffffff"
    });
}

// 批量生成
function batchCreateCode(){
    const name = document.getElementById("batchName").value.trim();
    const batch = document.getElementById("batchBatch").value.trim();
    const msg = document.getElementById("batchMsg").value.trim();
    const num = Math.min(50, Math.max(1, Number(document.getElementById("batchNum").value)||10));
    if(!name) return toast("请填写统一产品名称");
    for(let i=0;i<num;i++){
        const r = {
            id: generateId(),
            productName: name,
            batchNo: batch,
            remark: `批量生成#${i+1}`,
            message: msg,
            createTime: new Date().toLocaleString(),
            createTimestamp: Date.now(),
            verifyCount: 0,
            verifyHistory: []
        }
        db.records.push(r);
    }
    saveData();
    toast(`批量${num}个防伪码已入库`);
}

// 导出二维码图片
function saveQrImg(){
    if(!currentQrData) return toast("请先生成防伪二维码");
    const card = document.getElementById("exportCard");
    card.style.display = "block"; // 临时显示
    html2canvas(card,{backgroundColor:"#ffffff",scale:2}).then(canvas=>{
        card.style.display = "none"; // 截图完隐藏
        const a = document.createElement("a");
        a.download = `白桦防伪_${currentQrData.id}.jpg`;
        a.href = canvas.toDataURL("image/jpeg");
        a.click();
    })
}

// 导出全部JSON数据库
function exportAllJson(){
    const jsonStr = JSON.stringify(db,null,2);
    const blob = new Blob([jsonStr],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `白桦防伪数据库_${new Date().toLocaleDateString()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("JSON备份文件已下载");
}

// 数据库编辑弹窗
function openDbEdit(){
    document.getElementById("dbEditor").value = JSON.stringify(db,null,2);
    document.getElementById("dbModal").classList.add("show");
}
function closeDbModal(){
    document.getElementById("dbModal").classList.remove("show");
}
function saveDbFromText(){
    try{
        const newDb = JSON.parse(document.getElementById("dbEditor").value);
        if(!Array.isArray(newDb.records)) throw "格式错误";
        db = newDb;
        saveData();
        closeDbModal();
        toast("数据库导入成功");
    }catch(err){
        toast("JSON格式错误，导入失败");
    }
}

// 渲染数据库记录列表
function renderDbList(){
    const wrap = document.getElementById("dbListWrap");
    if(!db.records || db.records.length === 0){
        wrap.innerHTML = '<div class="empty-tip">暂无记录</div>';
        return;
    }
    // 倒序显示，最新的在前面
    const list = [...db.records].reverse();
    let html = '<div class="db-list-header"><h4>全部记录</h4><span>共 '+db.records.length+' 条</span></div>';
    list.forEach(item=>{
        html += `<div class="db-record">
            <div class="db-record-header">
                <span class="db-record-id">${item.id}</span>
            </div>
            <div class="db-record-body">
                <span>📦 ${item.productName||'-'}</span>
                <span>🏷️ ${item.batchNo||'-'}</span>
                <span>🔍 ${item.verifyCount||0}次</span>
            </div>
            <div class="db-record-actions">
                <button class="btn-view" onclick="previewRecord('${item.id}')">查看详情</button>
                <button class="btn-del" onclick="deleteRecord('${item.id}')">删除</button>
            </div>
        </div>`;
    });
    wrap.innerHTML = html;
}

// 删除单条记录
function deleteRecord(id){
    if(!confirm('确定要删除该防伪记录吗？ID: '+id)) return;
    db.records = db.records.filter(r=>r.id !== id);
    saveData();
    toast("记录已删除");
}

// 预览记录详情（弹窗显示）
function previewRecord(id){
    const r = db.records.find(item=>item.id === id);
    if(!r) return toast("记录不存在");
    const info = JSON.stringify(r, null, 2);
    document.getElementById("dbEditor").value = info;
    document.getElementById("dbModal").classList.add("show");
}

// 提交验证
function submitVerify(){
    let input = document.getElementById("inputId").value.trim();
    if(!input) return toast("请输入防伪ID");
    let targetId = input;
    if(input.includes("?verify=")){
        const params = new URLSearchParams(input.split("?")[1]);
        targetId = params.get("verify");
    }
    const record = db.records.find(item=>item.id === targetId);
    // 切换到结果页
    document.getElementById("homePanel").style.display="none";
    document.getElementById("inputPanel").classList.remove("show");
    document.getElementById("resultPanel").classList.add("show");
    const circle = document.getElementById("circleIcon");
    const title = document.getElementById("resultTitle");
    const desc = document.getElementById("resultDesc");
    const infoWrap = document.getElementById("infoWrap");
    const msgWrap = document.getElementById("msgWrap");
    msgWrap.classList.remove("show");
    if(!record){
        circle.className = "circle circle-fake";
        circle.innerText = "❌";
        title.className = "result-title title-fake";
        title.innerText = "无匹配防伪记录";
        desc.innerText = "该编号不存在官方数据库，疑似假冒产品";
        infoWrap.innerHTML = `<div class="info-line"><span class="info-label">查询ID</span><span class="info-val">${targetId}</span></div>`;
        return;
    }
    // 更新验证次数
    record.verifyCount += 1;
    record.verifyHistory.push({time:new Date().toLocaleString()});
    saveData();
    // 渲染产品信息
    let html = `<div class="info-line"><span class="info-label">产品名称</span><span class="info-val">${record.productName}</span></div>`;
    if(record.batchNo) html += `<div class="info-line"><span class="info-label">批次</span><span class="info-val">${record.batchNo}</span></div>`;
    html += `
        <div class="info-line"><span class="info-label">防伪ID</span><span class="info-val">${record.id}</span></div>
        <div class="info-line"><span class="info-label">生成时间</span><span class="info-val">${record.createTime}</span></div>
        <div class="info-line"><span class="info-label">累计查询</span><span class="info-val">${record.verifyCount}次</span></div>
    `;
    infoWrap.innerHTML = html;
    if(record.message){
        msgWrap.classList.add("show");
        msgWrap.innerHTML = `<div style="font-weight:600;margin-bottom:8px;">商家寄语 💌</div>${record.message}`;
    }
    if(record.verifyCount === 1){
        circle.className = "circle circle-success";
        circle.innerText = "✅";
        title.className = "result-title title-success";
        title.innerText = "正品首次验证";
        desc.innerText = "白桦官方正品，可放心使用";
    }else{
        circle.className = "circle circle-warn";
        circle.innerText = "⚠️";
        title.className = "result-title title-warn";
        title.innerText = "多次查询提醒";
        desc.innerText = "该防伪码已多次被查询，留意二手/仿冒风险";
    }
}

// 扫码功能
function openScan(){
    document.getElementById("scanModal").classList.add("show");
    scanner = new Html5Qrcode("reader");
    scanner.start({facingMode:currentCamera},{fps:10,qrbox:{width:220,height:220}},res=>{
        closeScan();
        document.getElementById("inputId").value = res;
        submitVerify();
    },()=>{});
}
function closeScan(){
    document.getElementById("scanModal").classList.remove("show");
    if(scanner){
        scanner.stop().catch(()=>{});
        scanner = null;
    }
}
function switchCamera(){
    currentCamera = currentCamera === "environment" ? "user" : "environment";
    closeScan();
    setTimeout(open,300);
}
// 相册图片识别
document.getElementById("imgFile").onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const s = new Html5Qrcode("reader");
    const res = await s.scanFile(file,true).catch(()=>null);
    closeScan();
    if(res){
        document.getElementById("inputId").value = res;
        submitVerify();
    }else toast("图片未识别到二维码");
    e.target.value = "";
}

// 页面初始化
window.onload = function(){
    loadData();
    renderDbList();
    // URL携带防伪ID自动验证
    const urlParams = new URLSearchParams(location.search);
    const autoId = urlParams.get("verify");
    if(autoId){
        document.getElementById("inputId").value = autoId;
        submitVerify();
    }
}
</script>
